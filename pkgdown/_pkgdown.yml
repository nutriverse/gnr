title: gnr

url: https://nutriverse.io/gnr/

development:
  mode: auto

template:
  bootstrap: 5
  theme: breeze-light
  bslib:
    bootswatch: pulse
    pkgdown-nav-height: 100px
    success: "#004225"
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-0HP24WHNZG"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-0HP24WHNZG');
      </script>

navbar:
  bg: success
  type: dark
  structure:
    left:  [home, intro, reference, articles, news]
    right: [search, website, mastodon, bluesky, linkedin, github]
  components:
    # articles:
    #   text: Articles
    #   menu:
    #   - text: SLEAC Sampling Plan 
    #     href: articles/sampling-plan.html
    #   - text: SLEAC Classification
    #     href: articles/classification.html
    website:
      icon: "fa-globe"
      href: https://nutriverse.io
      aria-label: Website
    mastodon:
      icon: fab fa-mastodon fa-lg
      href: https://mastodon.social/@nutriverse
      aria-label: Mastodon
    bluesky:
      icon: "fab fa-bluesky fa-lg"
      href: https://bsky.app/profile/nutriverse.io
      aria-label: Bluesky
    linkedin:
      icon: "fab fa-linkedin fa-lg"
      href: https://www.linkedin.com/company/nutriverse-community
      aria-label: LinkedIn

home:
  links:
  - text: Read more about the Global Nutrition Report
    href: https://globalnutritionreport.org/

reference:
  - title: Download data and assets
    contents:
    - starts_with("download")

  - title: Plot
    contents:
    - theme_gnr

  - title: Datasets
    contents:
    - indicator_description
    - gnr_data
